function schedAnalyze(id){
  var W=id.width,H=id.height,px=id.data;
  function mn(i){var r=px[i],g=px[i+1],b=px[i+2];return r<g?(r<b?r:b):(g<b?g:b)}
  function isGray(i){var r=px[i],g=px[i+1],b=px[i+2];var l=(r+g+b)/3;return Math.abs(r-g)<9&&Math.abs(g-b)<9&&l>165&&l<218}
  var rowc=new Array(H),rx0=new Array(H),rx1=new Array(H),y,x;
  for(y=0;y<H;y++){var c=0,a=-1,b2=-1;for(x=0;x<W;x++){if(isGray((y*W+x)*4)){c++;if(a<0)a=x;b2=x}}rowc[y]=c;rx0[y]=a;rx1[y]=b2}
  var bars=[],cur=null;
  for(y=0;y<H;y++){
    var ok=rowc[y]>=W*0.5&&(rx1[y]-rx0[y])>=W*0.6;
    if(ok){if(cur&&y-cur.y1<=2)cur.y1=y;else{cur={y0:y,y1:y};bars.push(cur)}}
  }
  bars=bars.filter(function(b){return b.y1-b.y0>=5});
  if(!bars.length)return {err:"표를 찾지 못했어요"};
  var xs=[],xe=[];bars.forEach(function(b){var m=(b.y0+b.y1)>>1;xs.push(rx0[m]);xe.push(rx1[m])});
  xs.sort(function(a,b){return a-b});xe.sort(function(a,b){return a-b});
  var X0=xs[xs.length>>1]-1,X1=xe[xe.length>>1]+1,cw=(X1-X0)/7;
  var k=(X1-X0)/455;
  function R(v){return Math.max(1,Math.round(v*k))}
  var G=R(1),M=R(3),PAD=R(1),lines=[];
  bars.forEach(function(b,bi){
    var ty=b.y1+1+G,by=(bi+1<bars.length)?bars[bi+1].y0-1-G:H-1;
    for(var col=0;col<7;col++){
      var cx0=Math.round(X0+col*cw)+M,cx1=Math.round(X0+(col+1)*cw)-M,w=cx1-cx0;
      if(w<8)continue;
      var inkrow=[];
      for(y=ty;y<=by;y++){
        var n=0;for(x=cx0;x<cx1;x++)if(mn((y*W+x)*4)<115)n++;
        inkrow.push(n>=w*0.75?0:n);
      }
      var yy=0,len=inkrow.length;
      while(yy<len){
        if(inkrow[yy]>0){
          var s=yy,e=yy;
          for(;;){var nx=-1;for(var q=1;q<=G+1&&e+q<len;q++)if(inkrow[e+q]>0){nx=e+q;break}if(nx<0)break;e=nx}
          var ax=1e9,bx=-1;
          for(y=s;y<=e;y++){if(!inkrow[y])continue;for(x=cx0;x<cx1;x++)if(mn(((ty+y)*W+x)*4)<115){if(x<ax)ax=x;if(x>bx)bx=x}}
          var h=e-s+1,ww=bx-ax+1;
          if(h>=R(6)&&h<=R(22)&&ww>=R(10)){
            var ex=Math.max(cx0-2,ax-PAD),ey=Math.max(ty,ty+s-PAD),ew=Math.min(cx1+2,bx+1+PAD)-ex,eh=Math.min(by+1,ty+e+1+PAD)-ey;
            var vals=[],j,i;
            for(j=0;j<eh;j++)for(i=0;i<ew;i++)vals.push(mn(((ey+j)*W+ex+i)*4));
            var sorted=vals.slice().sort(function(a,b){return a-b});
            var bg=sorted[Math.floor(sorted.length*0.85)]||255;if(bg<120)bg=120;
            var dk=new Float32Array(ew*eh);
            for(j=0;j<eh;j++)for(i=0;i<ew;i++){var v=(bg-vals[j*ew+i])/bg;if(v<0.12)v=0;if(v>1)v=1;dk[j*ew+i]=v}
            lines.push({blk:bi,col:col,x:ex,y:ey,w:ew,h:eh,tx:ax,ty:ty+s,tw:ww,th:h,dk:dk,k:k});
          }
          yy=e+1;
        }else yy++;
      }
    }
  });
  return {W:W,H:H,bars:bars,X0:X0,X1:X1,k:k,lines:lines};
}
function schedScore(t,c){
  var k=t.k,tol=Math.max(3,Math.round(3*k));
  if(Math.abs(t.tw-c.tw)>tol||Math.abs(t.th-c.th)>tol)return 0;
  var n=Math.max(1,Math.round(t.tw/(t.th*0.95))),best=0;
  var ox=t.tx-t.x,SX=Math.max(2,Math.round(2*k)),SY=Math.max(1,Math.round(k)),mg=Math.max(1,Math.round(k));
  for(var dy=-SY;dy<=SY;dy++)for(var dx=-SX;dx<=SX;dx++){
    var mins=1;
    for(var q=0;q<n;q++){
      var x0=Math.max(0,Math.floor(ox+q*t.tw/n)-mg),x1=Math.min(t.w,Math.ceil(ox+(q+1)*t.tw/n)+mg);
      var N=0,sa=0,sb=0,saa=0,sbb=0,sab=0;
      for(var j=0;j<t.h;j++){var cj=j+dy;
        for(var i=x0;i<x1;i++){var ci=i+dx;
          var a=t.dk[j*t.w+i],b=(cj<0||cj>=c.h||ci<0||ci>=c.w)?0:c.dk[cj*c.w+ci];
          N++;sa+=a;sb+=b;saa+=a*a;sbb+=b*b;sab+=a*b}}
      var va=saa-sa*sa/N,vb=sbb-sb*sb/N,r=0;
      if(va>0&&vb>0)r=(sab-sa*sb/N)/Math.sqrt(va*vb);
      if(r<mins)mins=r;
      if(mins<best)break;
    }
    if(mins>best)best=mins;
  }
  return best;
}

    else if(f==="h")document.execCommand("hiliteColor",false,v);
    else if(f==="x"){document.execCommand("removeFormat");document.execCommand("hiliteColor",false,"transparent")}
  }catch(e){}
  saveFrom(ed);
}
document.addEventListener("pointerdown",function(e){
  var b=e.target.closest&&e.target.closest("button");if(!b)return;
  var f=b.closest(".fmt");
  if(f||b.hasAttribute("data-photo")||b.id==="npphoto")e.preventDefault();
  if(f)fmtApply(b);
},true);
document.addEventListener("paste",function(e){
  var t=e.target&&e.target.closest&&e.target.closest(".nta,.npta");if(!t)return;
  e.preventDefault();
  var tx=(e.clipboardData||window.clipboardData).getData("text/plain");
  try{document.execCommand("insertText",false,tx)}catch(x){}
},true);
(function(){
  var sy=0;
  function ov(){return document.querySelector(".sheet.on,.full.on,.nscrim.on")}
  document.addEventListener("touchstart",function(e){if(e.touches.length)sy=e.touches[0].clientY},{passive:true,capture:true});
  document.addEventListener("touchmove",function(e){
    var o=ov();if(!o||e.touches.length!==1)return;
    var t=e.target,el=t&&t.nodeType===1?t:(t&&t.parentNode);
    if(el&&el.closest&&el.closest("#iv"))return;
    var sc=null;
    while(el&&el!==document.body&&el.nodeType===1){
      if(o.contains(el)&&el.scrollHeight>el.clientHeight+1){var oy=getComputedStyle(el).overflowY;if(oy==="auto"||oy==="scroll"){sc=el;break}}
      el=el.parentNode;
    }
    var y=e.touches[0].clientY,dy=y-sy;sy=y;
    if(!sc){e.preventDefault();return}
    if((dy>0&&sc.scrollTop<=0)||(dy<0&&sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1))e.preventDefault();
  },{passive:false,capture:true});
})();
function vvFit(){
  var vv=window.visualViewport,np=$("np");if(!vv||!np)return;
  var kb=vv.height<window.innerHeight*0.8;
  if(np.classList.contains("on")){
    np.style.top=vv.offsetTop+"px";np.style.bottom="auto";np.style.height=vv.height+"px";
    np.classList.toggle("kb",kb);
  }else{np.style.top="";np.style.bottom="";np.style.height="";np.classList.remove("kb")}
  var f=document.querySelector(".nb .fmt"),w=f&&f.parentNode,ae=document.activeElement,ed=ae&&ae.closest&&ae.closest(".nta");
  if(f&&w&&w.classList.contains("fmtw")){
    if(ed&&kb){w.style.minHeight=w.offsetHeight+"px";f.classList.add("fix");f.style.top=vv.offsetTop+"px"}
    else{f.classList.remove("fix");f.style.top="";w.style.minHeight=""}
  }
}
if(window.visualViewport){window.visualViewport.addEventListener("resize",vvFit);window.visualViewport.addEventListener("scroll",vvFit)}
window.addEventListener("orientationchange",vvFit);
document.addEventListener("focusin",function(){setTimeout(vvFit,50);setTimeout(vvFit,350)});
document.addEventListener("focusout",function(){setTimeout(vvFit,50);setTimeout(vvFit,350)});
function askPhoto(sel,key){
  var ed=document.querySelector(sel),s=window.getSelection();
  pickSel=sel;pickKey=key;pickRange=null;
  if(ed&&s&&s.rangeCount&&ed.contains(s.anchorNode))pickRange=s.getRangeAt(0).cloneRange();
  $("nimgf").click();
}
function insertToken(tok){
  var ed=document.querySelector(pickSel);if(!ed)return;
  ceInsert(ed,tok);notes[pickKey]=ceGet(ed);saveN();
}
$("nimgf").onchange=function(){
  var f=this.files[0];this.value="";if(!f||pickKey===null)return;
  var id=Date.now().toString(36).slice(-5)+Math.random().toString(36).slice(2,5);
  if(/^video\//.test(f.type)||/\.(mp4|mov|m4v|webm)$/i.test(f.name||"")){
    if(f.size>80*1048576){$("msg").textContent="영상이 너무 커요. 80MB 이하만 넣을 수 있어요.";return}
    setVideo(id,f);idbPutV(id,f);
    videoPoster(f,function(p){if(p){imgs[id+"p"]=p;idbPut(id+"p",p)}insertToken("[[영상:"+id+"]]")});
    return;
  }
  fileToUrl(f,function(url){
    if(!url){$("msg").textContent="사진을 열지 못했어요.";return}
    imgs[id]=url;idbPut(id,url);insertToken("[[사진:"+id+"]]");
  });
};
function openViewer(id){
  if(!imgs[id])return;
  $("iv").innerHTML="<button id=ivx aria-label=\"닫기\">✕</button><img src=\""+imgs[id]+"\" alt=\"사진\">";
  $("iv").classList.add("on");
}
function openVideo(id){
  if(!vids[id])return;
  $("iv").innerHTML="<button id=ivx aria-label=\"닫기\">✕</button><video src=\""+vids[id]+"\" controls autoplay playsinline></video>";
  $("iv").classList.add("on");
}
$("iv").onclick=function(e){if(e.target&&e.target.tagName==="VIDEO")return;$("iv").classList.remove("on");$("iv").innerHTML=""};

applyTheme(cfg);applyUi();
render();
cfgImgs();
idbOpen(function(){idbLoad(function(){cfgImgs();if(!$("v3").classList.contains("hide"))renderNotes();if(nPop)renderPop()})});
if(!canStore)$("msg").textContent="이 화면에서는 기록이 저장되지 않을 수 있어요. 인터넷 주소로 열어서 사용해 주세요.";
}
function boot(){
  try{start()}catch(err){
    var d=document.createElement("pre");
    d.style.cssText="white-space:pre-wrap;padding:12px;font-size:13px;color:#b00";
    d.textContent="화면을 불러오지 못했어요: "+(err&&err.message);
    document.body.appendChild(d);
  }
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
</script>
